name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build baseapp
        run: cargo build --release --locked -p baseapp --target ${{ matrix.target }}

      - name: Build the Debian package
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: amd64
        run: bash packaging/linux/build-deb.sh

      - name: Upload the Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Stage the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/baseapp.exe" dist/Huddle.exe

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile innosetup.exe
          Start-Process .\innosetup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $env:HUDDLE_VERSION = $version
          $env:HUDDLE_EXE = (Resolve-Path "dist/Huddle.exe").Path
          $env:HUDDLE_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\huddle.iss

      - name: Upload the Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-windows-exe
          path: dist/Huddle.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-windows-setup
          path: dist/Huddle-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: baseapp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/baseapp
          if-no-files-found: error
          retention-days: 14
