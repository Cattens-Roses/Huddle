name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  HUDDLE_UPDATE_CHANNEL: beta
  HUDDLE_UPDATE_REPO: Cattens-Roses/Huddle

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT="${GITHUB_SHA:0:7}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="$BASE"
          else
            # Use -gSHA (not +SHA): '+' breaks some apt/URL clients on GitHub Pages.
            VER="${BASE}-g${SHORT}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "HUDDLE_BUILD_VERSION=$VER" >> "$GITHUB_ENV"
          echo "HUDDLE_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ steps.ver.outputs.version }}

      - name: Build huddle
        run: cargo build --release --locked -p baseapp --target ${{ matrix.target }}

      - name: Upload Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-bin
          path: target/${{ matrix.target }}/release/huddle
          if-no-files-found: error
          retention-days: 14

      - name: Build the Debian package
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: amd64
          HUDDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: bash packaging/linux/build-deb.sh

      - name: Build the RPM package
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          HUDDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          bash packaging/linux/build-rpm.sh

      - name: Build the AppImage
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          HUDDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sudo apt-get install -y --no-install-recommends file zsync libfuse2 || true
          bash packaging/linux/build-appimage.sh

      - name: Upload the Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload the RPM package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload the AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Stage the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/huddle.exe" dist/Huddle.exe
          New-Item -ItemType Directory -Force -Path dist/huddle-portable | Out-Null
          Copy-Item dist/Huddle.exe dist/huddle-portable/Huddle.exe
          Copy-Item COPYING dist/huddle-portable/LICENSE
          Copy-Item THIRD-PARTY.md dist/huddle-portable/THIRD-PARTY.md

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile innosetup.exe
          Start-Process .\innosetup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HUDDLE_VERSION = "${{ steps.ver.outputs.version }}"
          $env:HUDDLE_EXE = (Resolve-Path "dist/Huddle.exe").Path
          $env:HUDDLE_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\huddle.iss

      - name: Build Windows update manifest
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          bash packaging/make-update-manifest.sh dist/huddle-portable windows-x64 "$VER" dist/update-windows
          (
            cd dist
            rm -f "huddle-update-windows-${VER}.zip"
            if command -v zip >/dev/null 2>&1; then
              zip -r "huddle-update-windows-${VER}.zip" update-windows
            else
              powershell -NoProfile -Command "Compress-Archive -Path update-windows -DestinationPath huddle-update-windows-${VER}.zip -Force"
            fi
          )

      - name: Upload the Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-windows-exe
          path: dist/Huddle.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-windows-setup
          path: dist/Huddle-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows update pack
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-update-windows
          path: |
            dist/update-windows/**
            dist/huddle-update-windows-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: huddle-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/huddle
          if-no-files-found: error
          retention-days: 14

  package-arch:
    name: Arch Linux package
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    needs: [build]
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT="${GITHUB_SHA:0:7}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="$BASE"
          else
            VER="${BASE}-g${SHORT}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "HUDDLE_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          pacman -Sy --noconfirm base-devel

      - uses: actions/download-artifact@v4
        with:
          name: huddle-linux-bin
          path: target/x86_64-unknown-linux-gnu/release

      - name: Prepare binary
        run: |
          chmod +x target/x86_64-unknown-linux-gnu/release/huddle
          # makepkg refuses to run as root; use a build user.
          useradd -m builder
          mkdir -p dist
          chown -R builder:builder .

      - name: Build Arch package
        env:
          TARGET: x86_64-unknown-linux-gnu
          HUDDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          su builder -c 'bash packaging/linux/build-arch.sh'

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  beta:
    name: Publish beta release
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build.result == 'success' &&
      needs.package-arch.result == 'success'
    needs: [build, package-arch]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT="${GITHUB_SHA:0:7}"
          echo "version=${BASE}-g${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist update-windows
          cp -f artifacts/huddle-linux-deb/*.deb dist/
          cp -f artifacts/huddle-linux-rpm/*.rpm dist/
          cp -f artifacts/huddle-linux-appimage/*.AppImage dist/
          cp -f artifacts/huddle-linux-arch/*.pkg.tar.zst dist/
          cp -f artifacts/huddle-windows-setup/Huddle-Setup.exe dist/
          cp -f artifacts/huddle-windows-exe/Huddle.exe dist/
          MANIFEST="$(find artifacts/huddle-update-windows -name 'update-manifest-windows-x64.json' | head -n 1)"
          if [[ -z "$MANIFEST" ]]; then
            echo "Missing Windows update manifest in artifacts" >&2
            find artifacts -maxdepth 4 -type f | head -n 200
            exit 1
          fi
          UPDATE_ROOT="$(dirname "$MANIFEST")"
          cp -a "$UPDATE_ROOT"/. update-windows/
          test -f update-windows/update-manifest-windows-x64.json
          test -d update-windows/blobs
          ls -lah dist update-windows

      - name: Write beta release notes
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          SHORT="${GITHUB_SHA:0:7}"
          cat > beta-notes.md <<EOF
          **Rolling beta** built from \`main\` at \`${SHORT}\`.

          Package version: ${VER}

          This is an automated prerelease. Prefer a tagged \`v*\` release for day-to-day use when available.

          ### Packages
          - Linux: \`.deb\`, \`.rpm\`, AppImage, Arch \`.pkg.tar.zst\`
          - Windows: \`Huddle-Setup.exe\` / \`Huddle.exe\`

          ### Auto-updates
          - **Windows** - in-app differential updates from this \`beta\` channel
          - **Linux** - package repos at https://cattens-roses.github.io/Huddle/
          EOF

      - name: Replace previous beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes --cleanup-tag || true

      - name: Publish GitHub beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta (rolling)
          body_path: beta-notes.md
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.pkg.tar.zst
            dist/Huddle-Setup.exe
            dist/Huddle.exe

      - name: Publish Windows update assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUDDLE_UPDATE_CHANNEL: beta
        run: |
          if [ -f update-windows/update-manifest-windows-x64.json ]; then
            bash packaging/publish-update-assets.sh update-windows windows-x64
          else
            echo "No Windows update manifest found; skipping blob publish"
            find . -name 'update-manifest*.json' -o -name 'b_*' | head
            exit 1
          fi

  packages:
    name: Publish package repositories
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.build.result == 'success' &&
      needs.package-arch.result == 'success'
    needs: [build, package-arch]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Init gh-pages if missing
        run: |
          if [ ! -d gh-pages/.git ]; then
            rm -rf gh-pages
            mkdir gh-pages
            cd gh-pages
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout -b gh-pages
          fi

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c

      - name: Publish apt / rpm / arch repos
        run: |
          set -euo pipefail
          touch gh-pages/.nojekyll

          # apt
          mkdir -p gh-pages/pool/main
          cp -f artifacts/huddle-linux-deb/*.deb gh-pages/pool/main/
          ls -1t gh-pages/pool/main/huddle_*.deb | tail -n +6 | xargs -r rm -f
          (
            cd gh-pages
            dpkg-scanpackages --multiversion pool/ > Packages
            gzip -k -f Packages
            apt-ftparchive -o APT::FTPArchive::Release::Origin=huddle \
              -o APT::FTPArchive::Release::Label=huddle \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Architectures=amd64 \
              -o APT::FTPArchive::Release::Components=main \
              -o APT::FTPArchive::Release::Description="Huddle apt repository" \
              release . > Release
          )

          # rpm / dnf
          mkdir -p gh-pages/rpm
          cp -f artifacts/huddle-linux-rpm/*.rpm gh-pages/rpm/
          ls -1t gh-pages/rpm/huddle-*.rpm | tail -n +6 | xargs -r rm -f
          createrepo_c gh-pages/rpm

          # arch / pacman
          mkdir -p gh-pages/arch
          cp -f artifacts/huddle-linux-arch/*.pkg.tar.zst gh-pages/arch/
          ls -1t gh-pages/arch/huddle-*.pkg.tar.zst | tail -n +6 | xargs -r rm -f
          docker run --rm -v "$GITHUB_WORKSPACE/gh-pages/arch:/repo" archlinux:latest \
            bash -c "pacman -Sy --noconfirm pacman-contrib && cd /repo && rm -f huddle.db* huddle.files* && repo-add huddle.db.tar.gz *.pkg.tar.zst"

      - name: Write install page
        run: |
          cat > gh-pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Huddle packages</title>
            <style>
              body{font-family:monospace;max-width:860px;margin:40px auto;background:#0d1117;color:#c9d1d9;line-height:1.5}
              h1,h2{color:#58a6ff} pre{background:#161b22;padding:16px;border-radius:6px;overflow-x:auto}
              a{color:#79c0ff}
            </style>
          </head>
          <body>
            <h1>Huddle packages</h1>
            <p>Source: <a href="https://github.com/Cattens-Roses/Huddle">github.com/Cattens-Roses/Huddle</a>
            · Releases: <a href="https://github.com/Cattens-Roses/Huddle/releases/tag/beta">beta</a></p>

            <h2>Debian / Ubuntu (apt)</h2>
            <pre>curl -fsSL https://cattens-roses.github.io/Huddle/huddle.sources \
              | sudo tee /etc/apt/sources.list.d/huddle.sources
            sudo apt update
            sudo apt install huddle</pre>

            <h2>Fedora / AlmaLinux / RHEL (dnf)</h2>
            <pre>sudo tee /etc/yum.repos.d/huddle.repo &lt;&lt;'REPO'
            [huddle]
            name=Huddle
            baseurl=https://cattens-roses.github.io/Huddle/rpm
            enabled=1
            gpgcheck=0
            REPO
            sudo dnf install huddle</pre>

            <h2>Arch Linux (pacman)</h2>
            <pre>sudo tee -a /etc/pacman.conf &lt;&lt;'REPO'

            [huddle]
            SigLevel = Optional TrustAll
            Server = https://cattens-roses.github.io/Huddle/arch/
            REPO
            sudo pacman -Sy huddle</pre>

            <h2>AppImage</h2>
            <p>Download the <code>.AppImage</code> from the
            <a href="https://github.com/Cattens-Roses/Huddle/releases/tag/beta">beta release</a>,
            then:</p>
            <pre>chmod +x Huddle-*-x86_64.AppImage
            ./Huddle-*-x86_64.AppImage</pre>
          </body>
          </html>
          EOF
          cat > gh-pages/huddle.sources <<'EOF'
          Types: deb
          URIs: https://cattens-roses.github.io/Huddle
          Suites: ./
          Trusted: yes
          EOF

      - name: Commit & push gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "packages: apt rpm arch"
          git push origin HEAD:gh-pages --force
