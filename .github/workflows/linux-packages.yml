name: Linux packages

# Standalone packaging pass for Linux formats. The main Build workflow also
# produces these on push to main; use this to rebuild packages from artifacts
# or to iterate on packaging without a full multi-OS release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/linux/**"
      - "packaging/arch/**"
      - ".github/workflows/linux-packages.yml"
      - "assets/linux/**"

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  package:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT="${GITHUB_SHA:0:7}"
          VER="${BASE}-g${SHORT}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "HUDDLE_BUILD_VERSION=$VER" >> "$GITHUB_ENV"
          echo "HUDDLE_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold rpm file \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-packages-${{ steps.ver.outputs.version }}

      - name: Build huddle
        run: cargo build --release --locked -p baseapp --target x86_64-unknown-linux-gnu

      - name: Package deb / rpm / AppImage
        env:
          TARGET: x86_64-unknown-linux-gnu
          HUDDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash packaging/linux/build-deb.sh
          bash packaging/linux/build-rpm.sh
          bash packaging/linux/build-appimage.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-bin
          path: target/x86_64-unknown-linux-gnu/release/huddle
          if-no-files-found: error
          retention-days: 14

  package-arch:
    name: Build Arch package
    needs: [package]
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT="${GITHUB_SHA:0:7}"
          echo "version=${BASE}-g${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: pacman -Sy --noconfirm base-devel

      - uses: actions/download-artifact@v4
        with:
          name: huddle-linux-bin
          path: target/x86_64-unknown-linux-gnu/release

      - name: Prepare binary
        run: |
          chmod +x target/x86_64-unknown-linux-gnu/release/huddle
          useradd -m builder
          mkdir -p dist
          chown -R builder:builder .

      - name: Build Arch package
        env:
          TARGET: x86_64-unknown-linux-gnu
          HUDDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: su builder -c 'bash packaging/linux/build-arch.sh'

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: huddle-linux-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
