[package]
name = "baseapp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
profiler = ["gpui/profiler"]

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
env_logger.workspace = true
futures.workspace = true
matrix-sdk.workspace = true
ruma.workspace = true
rumpeg = "0.1.4"
rodio = { version = "0.19", features = ["symphonia-aac", "symphonia-isomp4"] }
matroska-demuxer = "0.8"
serde.workspace = true
serde_json = "1"
tokio.workspace = true
log.workspace = true
mime = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
image = { workspace = true, features = ["bmp"] }
i18n.workspace = true
icons.workspace = true
ui.workspace = true
raw-window-handle = "0.6"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
windows-sys.workspace = true
tao = "0.37"
wry = "0.57"

[build-dependencies]
embed-resource = "3.0.11"
